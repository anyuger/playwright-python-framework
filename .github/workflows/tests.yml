name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t playwright-framework .

      - name: Run tests in Docker
        run: docker run --rm -e REQRES_API_KEY=${{ secrets.REQRES_API_KEY }} -e AE_EMAIL=${{ secrets.AE_EMAIL }} -e AE_PASSWORD=${{ secrets.AE_PASSWORD }} -e HEADLESS=true playwright-framework
