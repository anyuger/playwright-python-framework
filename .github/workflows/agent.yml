name: Spec-to-test agent

# Run by hand from the Actions tab. The agent generates tests from specs,
# checks and runs them, and opens a pull request so a human reviews
# everything before it joins the main suite.
on:
  workflow_dispatch:
    inputs:
      site:
        description: "Site folder under sites/"
        default: "saucedemo"
      specs:
        description: "Spec names or patterns (empty = every spec in sites/<site>/specs/)"
        default: ""
      max_cost:
        description: "Budget for this run in USD"
        default: "1.00"
      max_repairs:
        description: "Self-healing attempts per spec"
        default: "2"
      overwrite:
        description: "Replace existing generated files (they may contain a human's review)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t playwright-framework .

      - name: Run the agent in Docker
        # The workspace is mounted so generated tests and reports come back out.
        # Inputs go through env vars, not straight into the shell command.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE: ${{ inputs.site }}
          SPECS: ${{ inputs.specs }}
          MAX_COST: ${{ inputs.max_cost }}
          MAX_REPAIRS: ${{ inputs.max_repairs }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -e ANTHROPIC_API_KEY -e SITE -e SPECS -e MAX_COST -e MAX_REPAIRS -e OVERWRITE \
            -e GITHUB_STEP_SUMMARY=/app/agent_summary.md \
            -e HEADLESS=true \
            playwright-framework \
            sh -c 'OW=""; [ "$OVERWRITE" = "true" ] && OW="--overwrite"; python -m agent --site "$SITE" $SPECS $OW --max-cost "$MAX_COST" --max-repairs "$MAX_REPAIRS"'

      - name: Hand files back to the runner user and show the report
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" .
          if [ -f agent_summary.md ]; then cat agent_summary.md >> "$GITHUB_STEP_SUMMARY"; rm agent_summary.md; fi

      - name: Upload run report and candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-run
          path: agent_runs/

      - name: Open a pull request for human review
        uses: peter-evans/create-pull-request@v7
        with:
          branch: agent/generated-tests-${{ inputs.site }}-${{ github.run_number }}
          title: "Agent-generated tests for ${{ inputs.site }} (run ${{ github.run_number }})"
          commit-message: "Add agent-generated tests from specs"
          add-paths: sites/${{ inputs.site }}/tests/generated/*.py
          body: |
            Generated by the spec-to-test agent. The full report is on the
            [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            - Trusted tests run as-is.
            - Tests with a `skip` marker need review. Check them, move any
              `NEW-LOCATOR` into its page object, then delete the marker.
