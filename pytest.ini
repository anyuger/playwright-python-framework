[pytest]
testpaths = sites agent/tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --headed --alluredir=allure-results --strict-markers
markers =
    smoke: critical-path tests, the quick check that the site works at all
    regression: the full suite for a site (smoke tests are part of it)